[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockean-lite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py==0.44.0",
    "openai==3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]